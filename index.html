<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Fast & Simple Note Taking</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Capture your thoughts instantly.</p>
    </header>

    <main>
        <section id="add-note-section">
            <h2>Add a note</h2>
            <form id="note-form">
                <div class="form-group">
                    <label for="note-input">Note Text</label>
                    <input type="text" id="note-input" placeholder="Type your note here..." autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="note-category">Category</label>
                    <select id="note-category">
                        <option value="personal">Personal</option>
                        <option value="work">Work</option>
                        <option value="study">Study</option>
                    </select>
                </div>
                <button type="submit" id="add-btn">Add Note</button>
            </form>
            <p id="error-message" aria-live="polite"></p>
        </section>

        <section id="notes-section">
            <div class="notes-header">
                <h2>Your notes</h2>
                <!-- Bonus: Clear All button -->
                <button type="button" id="clear-all-btn" class="hidden">Clear All</button>
            </div>
            
            <input type="search" id="search-input" placeholder="Search notes...">
            
            <p id="note-count"></p>
            
            <ul id="notes-list">
                <!-- Notes will be injected here by JavaScript -->
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 QuickNotes App. Built for the assignment.</p>
    </footer>
</body>
</html>
